      <animate attributeName="opacity" values=".35;1;.35" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <path d="M602 82V294" stroke="#E85B42" stroke-width="2"/>
    <text x="620" y="93" fill="#77736B" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="2">THREE IDEAS IN MOTION</text>
    <text x="620" y="309" fill="#77736B" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="2">LANGUAGE  /  MUSIC  /  WELLNESS</text>
    <path d="M64 342H1136" stroke="#26241F" stroke-opacity=".18"/>
    <rect x="0" y="0" width="1200" height="3" fill="#E85B42"/>

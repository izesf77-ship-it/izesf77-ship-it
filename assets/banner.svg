      <path d="M590 188C674 188 690 157 758 157S850 218 928 218 1008 180 1081 180 1120 184 1205 184" stroke-width="3"/>
      <path d="M590 188C672 188 687 207 758 207S850 138 928 138 1010 238 1081 238 1120 186 1205 186" stroke-width="2.5" opacity=".68"/>
      <path d="M590 188C671 188 684 227 758 227S850 118 928 118 1010 258 1081 258 1120 188 1205 188" stroke-width="2" opacity=".5"/>
      <path d="M590 188C670 188 680 247 758 247S850 98 928 98 1011 278 1081 278 1120 190 1205 190" stroke-width="2" opacity=".36"/>
    </g>
    <path d="M610 188C690 188 690 157 758 157S850 218 928 218 1008 180 1081 180 1120 184 1205 184" fill="none" stroke="#E85B42" stroke-width="1" stroke-dasharray="3 12" opacity=".85">
      <animate attributeName="stroke-dashoffset" from="0" to="-60" dur="4s" repeatCount="indefinite"/>
    </path>
    <circle r="5" fill="#E85B42">
      <animateMotion dur="7s" repeatCount="indefinite" path="M610 188C690 188 690 157 758 157S850 218 928 218 1008 180 1081 180 1120 184 1205 184"/>
    </circle>
    <circle cx="930" cy="188" r="4" fill="#7049A8">

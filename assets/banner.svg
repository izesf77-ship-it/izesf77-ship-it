<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="IZESF77 — independent product builder">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F7F5EF"/>
      <stop offset="1" stop-color="#EEECE5"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2=".3">
      <stop stop-color="#F26445"/>
      <stop offset=".55" stop-color="#D64269"/>
      <stop offset="1" stop-color="#7049A8"/>
    </linearGradient>
    <linearGradient id="wash">
      <stop stop-color="#F26445" stop-opacity=".1"/>
      <stop offset="1" stop-color="#7049A8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".45" fill="#282520" fill-opacity=".09"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="360" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#paper)"/>
    <rect width="1200" height="360" fill="url(#grain)" opacity=".3"/>
    <path d="M600 0V360" stroke="#282520" stroke-opacity=".12"/>
    <text x="64" y="47" fill="#26241F" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">IZESF77</text>
    <circle cx="151" cy="42" r="3" fill="#E85B42"/>
    <text x="170" y="47" fill="#77736B" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2.4">INDEPENDENT PRODUCT BUILDER</text>
    <text x="1135" y="47" fill="#77736B" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" text-anchor="end">EST. IN CODE  /  2026</text>
    <path d="M64 68H1136" stroke="#26241F" stroke-opacity=".18"/>
    <text x="64" y="149" fill="#26241F" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="-2">MAKE IDEAS</text>
    <text x="64" y="219" fill="#E85B42" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" letter-spacing="-3">REAL.</text>
    <text x="68" y="260" fill="#625F58" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing=".3">Software, interfaces, things worth shipping.</text>
    <g font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">
      <rect x="68" y="292" width="82" height="30" rx="15" fill="none" stroke="#C5C1B7"/>
      <text x="109" y="311" fill="#37342F" text-anchor="middle">NOVA</text>
      <rect x="160" y="292" width="82" height="30" rx="15" fill="#E85B42"/>
      <text x="201" y="311" fill="#FFF9EF" text-anchor="middle">VOLNA</text>
      <rect x="252" y="292" width="82" height="30" rx="15" fill="none" stroke="#C5C1B7"/>
      <text x="293" y="311" fill="#37342F" text-anchor="middle">LUNÉ</text>

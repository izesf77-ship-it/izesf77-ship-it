    <text x="1135" y="337" fill="#77736B" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="2" text-anchor="end">DESIGN  ·  BUILD  ·  SHIP</text>
    <ellipse cx="900" cy="190" rx="270" ry="160" fill="url(#wash)"/>
    <g fill="none" stroke="url(#wave)" stroke-linecap="round">
      <path d="M590 188C670 188 680 97 758 97S850 278 928 278 1011 120 1081 120 1120 190 1205 190" stroke-width="2" opacity=".36"/>
      <path d="M590 188C671 188 684 117 758 117S850 258 928 258 1010 140 1081 140 1120 188 1205 188" stroke-width="2" opacity=".5"/>
